name: Bite Routine .NET CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend-dotnet/**'
      - 'web/**'
      - '.github/workflows/dotnet-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend-dotnet/**'
      - 'web/**'
      - '.github/workflows/dotnet-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bite_routine_test
          POSTGRES_USER: bite_routine
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bite_routine -d bite_routine_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-dotnet
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend-dotnet/global.json
      - name: SDK
        run: dotnet --version
      - name: Restore
        run: dotnet restore BiteRoutine.slnx
      - name: Build
        run: dotnet build BiteRoutine.slnx --no-restore --configuration Release
      - name: Verify EF migration snapshot
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/BiteRoutine.Api --no-build --configuration Release
      - name: Test Identity registration and sessions
        env:
          BITE_ROUTINE_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=bite_routine_test;Username=bite_routine;Password=ci_test_only
        run: dotnet test BiteRoutine.slnx --no-build --configuration Release --filter FullyQualifiedName~AuthEndpointsTests
      - name: Test PostgreSQL catalog, Identity and diary isolation
        env:
          BITE_ROUTINE_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=bite_routine_test;Username=bite_routine;Password=ci_test_only
        run: dotnet test BiteRoutine.slnx --no-build --configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web for auth HTTP smoke
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Smoke test same-origin Identity session
        env:
          ConnectionStrings__BiteRoutine: Host=127.0.0.1;Port=5432;Database=bite_routine_test;Username=bite_routine;Password=ci_test_only
        run: |
          dotnet ef database update --project src/BiteRoutine.Api --no-build --configuration Release
          dotnet run --project src/BiteRoutine.Api --no-build --no-launch-profile --configuration Release --urls http://127.0.0.1:5080 > /tmp/bite-api.log 2>&1 &
          api_pid=$!
          (cd ../web && npm run start -- --hostname 127.0.0.1 > /tmp/bite-web.log 2>&1) &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5080/health/live >/dev/null && curl -fsS http://127.0.0.1:3000/login >/dev/null; then break; fi
            sleep 1
          done
          cd ../web
          npm run smoke:auth

  web-build:
    name: Web build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm run lint

