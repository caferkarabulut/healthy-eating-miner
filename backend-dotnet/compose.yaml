services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bite_routine
      POSTGRES_USER: bite_routine
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bite_routine_pg:/var/lib/postgresql/data
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bite_routine -d bite_routine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bite_routine_pg:
