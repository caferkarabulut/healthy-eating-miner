name: Mobile local test tools
on:
  pull_request:
    # Also runs while this tool PR targets the unmerged PR #27 branch.
    paths: ['scripts/mobile-test*.mjs', 'scripts/local-demo*.mjs', 'mobile/package.json', 'mobile/package-lock.json', '.github/workflows/mobile-test-tools.yml']
  push:
    branches: [main]
    paths: ['scripts/mobile-test*.mjs', 'scripts/local-demo*.mjs', 'mobile/package.json', 'mobile/package-lock.json', '.github/workflows/mobile-test-tools.yml']
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile --ignore-scripts
      # Fake loopback upstreams only. Never opens a public tunnel or uses a real DB/account.
      - run: node --test scripts/local-demo.test.mjs scripts/mobile-test.test.mjs
